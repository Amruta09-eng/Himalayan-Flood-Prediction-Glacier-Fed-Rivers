name: HimAlert AI — Python CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-import-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check syntax (py_compile)
        run: |
          python -m py_compile main.py
          python -m py_compile backend/app.py
          python -m py_compile backend/data_manager.py
          python -m py_compile backend/ml_engine.py
          python -m py_compile backend/backtesting.py
          python -m py_compile backend/simulator.py
          python -m py_compile backend/scientific_report.py
          echo "✅ All Python files pass syntax check"
